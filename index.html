<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trial Study</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="HSC.png">

  <style>
    :root {
      --accent: #0b57d0;
      --bg: #f0f4f9;
      --header-padding: 1rem;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #0a0a0a;
    }

    /* layout */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--bg);
      padding: var(--header-padding);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 600;
      font-style: italic;
      color: var(--accent);
    }

    /* fill remaining vertical space for the calendar */
    .calendar-container {
      flex: 1 1 auto;
      min-height: 0; /* allow the flex child to shrink correctly */
      width: 100%;
    }

    .calendar-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Trial Study Timetable</h1>
  </header>

  <main class="calendar-container" role="main">
    <iframe
      title="Trial Study Google Calendar"
      src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Australia%2FSydney&showPrint=0&showTitle=0&showCalendars=0&showTz=0&showTabs=0&mode=WEEK&src=Y182MGU3ZDMyZDg2Yjg5O[...INSERT FULL SRC HERE...]"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </main>
</body>
</html>
